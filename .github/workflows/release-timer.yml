name: Update timer release

# Rebuild the exploit from source and replace the asset the app downloads:
#   https://github.com/MVN123123123123123/TimerRoot/releases/download/bingchiling/timer
# The release tag is fixed, so the app URL never changes; only the asset does.
on:
  push:
    branches: [main]
    paths:
      - p7a/timer_p7a.c
      - .github/workflows/release-timer.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timer-release
  cancel-in-progress: true

env:
  NDK_VERSION: 29.0.14206865
  RELEASE_TAG: bingchiling
  TARGET: aarch64-linux-android21

jobs:
  build-and-release:
    name: Build and update release asset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned NDK
        shell: bash
        run: |
          set -euo pipefail

          # The runner image already provides the SDK and cmdline-tools; the
          # setup-android action's "sdkmanager tools" step fails because that
          # package no longer exists.  Use the preinstalled sdkmanager.
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          find_sdkmanager() {
            local c
            for c in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
                     "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
              if [ -x "$c" ]; then
                echo "$c"
                return 0
              fi
            done
            command -v sdkmanager
          }

          find_clang() {
            local root="$1" c
            for c in "$root/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/"*"/bin/${TARGET}-clang" \
                     "$root"/ndk/*/toolchains/llvm/prebuilt/*/bin/${TARGET}-clang; do
              if [ -x "$c" ]; then
                echo "$c"
                return 0
              fi
            done
            return 1
          }

          NDK="${SDK_ROOT}/ndk/${NDK_VERSION}"
          if [ ! -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/${TARGET}-clang" ]; then
            SDKMANAGER="$(find_sdkmanager || true)"
            if [ -n "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
              "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;${NDK_VERSION}" \
                || echo "::warning::pinned NDK ${NDK_VERSION} install failed; falling back"
            fi
          fi

          CC_PATH="$(find_clang "$SDK_ROOT" || true)"
          if [ -z "$CC_PATH" ]; then
            echo "::error::no aarch64 clang in $SDK_ROOT/ndk"
            ls -1 "$SDK_ROOT/ndk" 2>/dev/null || true
            exit 1
          fi
          NDK="${CC_PATH%%/toolchains/llvm/prebuilt/*}"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "Using NDK at $NDK (clang: $CC_PATH)"

      - name: Build timer
        shell: bash
        run: |
          set -euo pipefail
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/${TARGET}-clang"
          test -x "$CC"
          "$CC" -O2 -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -g -static -pthread \
            -o timer p7a/timer_p7a.c
          file timer
          # grep -c reads all input, so pipefail cannot turn grep's early
          # exit into SIGPIPE (141) here.
          test "$(strings timer | grep -c 'target=lynx')" -ge 1
          test "$(stat -c %s timer)" -gt 100000

      - name: Publish assets to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # The app uses the asset named "timer"; keep the historical
          # "timer_p7a" name and the source next to it for the release page.
          cp timer timer_p7a
          cp p7a/timer_p7a.c timer_p7a.c

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "timer-p7a" \
              --notes "Rolling timer exploit build, updated automatically from main." \
              --latest
          fi

          gh release upload "$RELEASE_TAG" \
            timer timer_p7a timer_p7a.c \
            --clobber
