# Kernel: 6.1.138-android14-11-g6ab8c9a86a33-ab14396278 (4K pages)
#
# Every constant below is derived from that factory boot.img:
#   boot.img     sha256 f54f4301b9e860671dfee9439a0e723dd8b3681ffa022e727607e63ed81aa98d
#   Image        sha256 63eda65a09019d824e41258b8aa2e53333bfb7178e7fee93a8f86355a9b08fff
#   vmlinux.elf  sha256 73503c47af89329a5ea91a3c3d357eef6fec2db66261021220c517ab098e09c4
#   btf.bin      sha256 ee00c556a6e81e4f7145389bc397c10b4d7fc4530da4485527b2a9a2620a4e2b
#
#   init_posix_timers   kmem_cache_create("posix_timers_cache", 0x108, ...,
#                       SLAB_PANIC|SLAB_ACCOUNT) at 0xffffffc009bd5d48
#                       -> timer_alloc 0x108
#   do_timer_create     bl kmem_cache_alloc at 0xffffffc008192088, returns to
#                       0xffffffc00819208c (x0 = posix_timers_cache
#                       @ 0xffffffc00a1fcca0)
#   copy_process        inlines dup_task_struct: bl kmem_cache_alloc_node at
#                       0xffffffc0080ab67c, returns to 0xffffffc0080ab680
#                       (x0 = task_struct_cachep @ 0xffffffc00a1d4618)
#                       -> low21 0xab680
#   BTF (bpftool): cred 0xb0 (usage 4 bytes at 0x0, uid 0x4, euid 0x14,
#                       caps 0x28, security 0x78, user 0x80, user_ns 0x88,
#                       ucounts 0x90, group_info 0x98);
#                       task_struct 0x12c0 (cred 0x838); k_itimer 0x108 (it 0x78)
#   fork_init() passes 0x12c0 and no android_arch_task_struct_size is on the
#                       vendor cmdline -> task_alloc_bytes 0x12c0.
#   LSM cred blobs: capability (order -1) and integrity register none;
#                       SELinux is the only cred-blob LSM -> offset 0x0.
#
# Vulnerability: fs/exec.c begin_new_exec() still calls
#   exec_mmap -> posix_cpu_timers_exit -> exit_itimers
#   (0xffffffc0083a2ae0 / 0xffffffc0083a2afc / 0xffffffc0083a2b0c),
#   so the stale timer node survives exec.

