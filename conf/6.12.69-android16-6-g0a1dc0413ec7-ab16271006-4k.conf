#         Xiaomi 17T Pro (warhol) - verified byte-identical below.
# Build : OS4.0.6.0.XPICNXM (HyperOS 4.0, China, Android 17)
# Kernel: 6.12.69-android16-6-g0a1dc0413ec7-ab16271006-4k (4K pages)
#
# Every constant below is derived from that factory boot.img:
#   boot.img     sha256 ceb03732abad458faa7046594974651b2f62400f76e4a880f323644eedb9a737
#   Image        sha256 2bdda2f4c4365b40f1ca7422d0bb9b8adb587c46f5a4f87bcbff00b82c300e9d
#   vmlinux.elf  sha256 bd6313d26f2f3b4cf5eaa9a8ac4f029ffc78bf709a61a42e9e5212548984545a
#   btf.bin      sha256 fa8975e3fa51a6ca600a3ae413c91c0b6b3008cd631943a9a00ed1dd4bd1dc75
#
#   init_posix_timers   kmem_cache_create("posix_timers_cache", 0x100, 0,
#                       SLAB_PANIC|SLAB_ACCOUNT) at 0xffffffc08214b470
#                       -> timer_alloc 0x100
#   do_timer_create     bl kmem_cache_alloc_noprof at 0xffffffc080354778,
#                       returns to 0xffffffc08035477c (x0 = posix_timers_cache
#                       @ 0xffffffc08285f3f0)
#   copy_process        inlines dup_task_struct: bl kmem_cache_alloc_node_noprof
#                       at 0xffffffc0800f42d4, returns to 0xffffffc0800f42d8
#                       (x0 = task_struct_cachep @ 0xffffffc0828366c8)
#                       -> low21 0xf42d8
#   BTF (bpftool): cred 0xb8 (usage 8 bytes at 0x0, uid 0x8, euid 0x18,
#                       caps 0x30, security 0x80, user 0x88, user_ns 0x90,
#                       ucounts 0x98, group_info 0xa0);
#                       task_struct 0x1440 (cred 0x900); k_itimer 0x100 (it 0x78)
#   vendor_boot cmdline: android_arch_task_struct_size=1024 (0x400).
#                       task_struct_vendor_size_setup() clamps to <=0x400 and
#                       adds to the 0x1440 base -> task_alloc_bytes 0x1840.
#   LSM cred blobs: capability (order -1) registers none; CONFIG_LSM order is
#                       landlock,lockdown,yama,loadpin,safesetid,selinux,smack,
#                       tomoyo,apparmor,ipe,bpf, and landlock is the first
#                       order-0 contributor (lbs_cred 0x8), so SELinux's
#                       task_security_struct starts at 0x8 (blob total 0x20).
#
# Vulnerability: fs/exec.c begin_new_exec() still calls
#   exec_task_namespaces -> posix_cpu_timers_exit -> exit_itimers
#   (0xffffffc08033c448 / 0xffffffc08033c45c / 0xffffffc08033c46c),
#   so the stale timer node survives exec.

