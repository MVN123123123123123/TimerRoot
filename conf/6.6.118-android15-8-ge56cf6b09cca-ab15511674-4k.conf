# TimerUAF kernel profile (HOCON; JSON remains valid)
# Device: Redmi Note 15 5G (kunzite)
# Build : OS3.0.304.0.WPQCNXM
# Kernel: 6.6.118-android15-8-ge56cf6b09cca-ab15511674-4k (4K pages)
#
# Every constant below is derived from that factory boot.img:
#   init_posix_timers   kmem_cache_create("posix_timers_cache", 0x108, 0,
#                       SLAB_PANIC|SLAB_ACCOUNT) -> timer_alloc 0x108
#   do_timer_create     bl kmem_cache_alloc at 0xffffffc080195d44, returns to
#                       0xffffffc080195d48 (x0 = posix_timers_cache)
#   copy_process        bl kmem_cache_alloc_node at 0xffffffc0800ab938,
#                       returns to 0xffffffc0800ab93c (x0 = task_struct_cachep)
#                       -> low21 0xab93c
#   task_struct_vendor_size_setup() adds 0x12c0 (sizeof task_struct), and
#   start_kernel() initialises arch_task_struct_size to 0x12c0.  This image's
#   vendor_boot/dtb/dtbo carry no android_arch_task_struct_size= parameter, so
#   the value stays 0x12c0.
#
# Vulnerability: fs/exec.c begin_new_exec() still calls
# posix_cpu_timers_exit() before exit_itimers().
release = "6.6.118-android15-8-ge56cf6b09cca-ab15511674-4k"
schema_version = 1
ksu_kmi = "android15-6.6"

page_size = 4096
page_shift = 12
