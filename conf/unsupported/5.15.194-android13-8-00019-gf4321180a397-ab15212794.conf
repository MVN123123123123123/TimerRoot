#
#   init_posix_timers   kmem_cache_create_usercopy("posix_timers_cache", 0x108,
#                       ..., SLAB_PANIC|SLAB_ACCOUNT) at 0xffffffc00a89bf20
#                       -> timer_alloc 0x108
#   do_timer_create     bl kmem_cache_alloc at 0xffffffc00827ed04, returns to
#                       0xffffffc00827ed08 (x0 = posix_timers_cache
#                       @ 0xffffffc00ad8d768)
#   copy_process        calls dup_task_struct, whose bl kmem_cache_alloc at
#                       0xffffffc008132d3c returns to 0xffffffc008132d40
#                       (x0 = task_struct_cachep @ 0xffffffc00ad65bb8)
#                       -> low21 0x132d40  (5.15 has no kmem_cache_alloc_node
