#
#   init_posix_timers   kmem_cache_create_usercopy("posix_timers_cache", 0x108,
#                       ..., SLAB_PANIC|SLAB_ACCOUNT) at 0xffffffc009c7ebf4
#                       -> timer_alloc 0x108
#   do_timer_create     bl kmem_cache_alloc at 0xffffffc0081b16d8, returns to
#                       0xffffffc0081b16dc (x0 = posix_timers_cache
#                       @ 0xffffffc00a32efa8)
#   copy_process        calls dup_task_struct, whose bl kmem_cache_alloc_node
#                       at 0xffffffc0080b7f3c returns to 0xffffffc0080b7f40
#                       (x0 = task_struct_cachep @ 0xffffffc00a3069f8)
#                       -> low21 0xb7f40
#   BTF (bpftool): cred 0xb0 (usage 4 bytes at 0x0, uid 0x4, euid 0x14,
